name: action-spacelift
description: SpaceLift Action to manage spaces, contexts, and stacks through the GraphQL endpoints and spacectl cli tool.
branding:
  icon: 'arrow-up'
  color: 'blue'

inputs:
  command:
    description: "Spacelift command."
    required: true
  region:
    description: "region"
    required: true
  env:
    description: "Environment"
    required: true
  service_name:
    description: "Service name"
    required: true
  label_prefix:
    description: "Label prefix"
    required: false
    default: "aws:services"
  label_suffix:
    description: "Label postfix"
    required: true
  github-token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}
  env_vars:
    description: "Environment variables"
    required: false
    default: "{}"
  zone:
    description: "Environment variables"
    required: false
    default: "{}"
  spacelift_module_token:
    description: "SpaceLift module token"
    required: true
  env_context:
    description: "Environment context"
    required: true
  deployment_path:
    description: "Deployment path"
    required: false
    default: "./deployment"

outputs:
  outputs: 
    description: "SpaceLift outputs"
    
runs:
  using: 'node20'
  main: 'dist/index.js'
